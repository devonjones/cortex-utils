name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # The queue lives in Postgres, and the defects this suite exists to catch --
    # partition coverage, EXTRACT returning numeric, an inverted FILTER -- are
    # invisible to a mock, which hands back whatever the code asked for. Tests
    # that skip everywhere are the same theatre they were written to replace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        run: uv run pytest -v

      - name: Fail if the live-Postgres tests were skipped
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        # A misconfigured service would turn this whole layer into silent skips,
        # which reads as coverage and is not.
        #
        # -p no:skipping is the whole point of this step. Without it the step
        # was decorative: pytest exits 0 when every test skips, so a guard
        # against silent skipping silently skipped. Measured -- 32 skipped,
        # exit 0. Disabling the plugin turns each skip into an error, so the
        # step exits 1 with no DSN and 0 with one.
        run: |
          uv run pytest tests/test_inspect_live.py tests/test_ops_live.py \
            tests/test_dead_letter_live.py tests/test_claim_token_guard_live.py \
            -q --no-header -p no:cacheprovider -p no:skipping

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/63779650346/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions@cortex-gmail.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/cortex-gmail/cortex/utils:${{ github.sha }} .
          docker build -t us-central1-docker.pkg.dev/cortex-gmail/cortex/utils:latest .
          docker push us-central1-docker.pkg.dev/cortex-gmail/cortex/utils:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/cortex-gmail/cortex/utils:latest
